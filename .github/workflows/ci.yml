name: ci
# Full gate on every push and PR: version coherence, core + server route
# tests (Stripe webhook forgery/replay, eval gate, finance), spec-validator
# parity against the official skills-ref, live SkillSpector scans, and the
# real-buyer e2e (packed packages, `allodic add`, key pinning, revocation).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.13.0 is the CLAIMED floor (node:sqlite; see engines + DEPLOY.md) —
        # it is tested, not assumed. '22' is the current line users actually get.
        node-version: ['22.13.0', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install official gate engines (pinned; spec parity + live scan tests)
        run: pip install --break-system-packages -r scripts/gate-engines.txt
      # npm ci: install EXACTLY the committed lockfile or fail — CI must never
      # green-light a dependency tree that differs from the one in the repo.
      - run: npm ci
      - run: npm test
      - name: Real-buyer e2e (packed packages)
        run: bash scripts/e2e.sh
  docker-smoke:
    name: Docker build and smoke
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: allodic-smoke:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Boot container
        run: |
          docker run -d \
            --name allodic-smoke \
            -p 127.0.0.1:8787:8787 \
            allodic-smoke:${GITHUB_SHA}

      - name: Verify API and bundled gate engines
        run: |
          ready=false

          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              http://127.0.0.1:8787/catalog >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Container did not become ready within 60 seconds"
            exit 1
          fi

          curl --fail --show-error --silent \
            http://127.0.0.1:8787/catalog >/dev/null

          docker exec allodic-smoke sh -c \
            'agentskills --help >/dev/null && skillspector --version'

      - name: Show container logs on failure
        if: failure()
        run: docker logs allodic-smoke || true

      - name: Remove container
        if: always()
        run: docker rm -f allodic-smoke || true