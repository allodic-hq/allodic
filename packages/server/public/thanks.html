<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>License issued — allodic</title><link rel="stylesheet" href="/assets/theme.css">
<style>
*{box-sizing:border-box;margin:0}body{background:var(--pagebg);background-image:repeating-linear-gradient(0deg,transparent,transparent 31px,color-mix(in srgb,var(--rule) 40%,transparent) 32px);font-family:var(--sans);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.r{background:var(--paper);width:min(430px,100%);padding:36px 30px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.stamp{display:inline-block;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.18em;color:var(--stamp);border:2.5px solid var(--stamp);padding:6px 12px;transform:rotate(-4deg);text-transform:uppercase;background:var(--stamp-soft);margin-bottom:18px}
h1{font-size:22px;margin-bottom:10px}p{font-size:14.5px;line-height:1.6;color:#565B63;margin-bottom:14px}
</style></head><body><main class="r"><span class="stamp">Payment received</span>
<h1>Your license is ready.</h1>
<p>Install on any machine — you'll confirm this purchase with a one-time code sent to your payment email:</p>
<div class="cmd">npx allodic add &lt;the listing URL&gt;</div>
<p style="margin-top:14px">Updates arrive automatically with <span style="font-family:var(--mono)">npx allodic update</span>. Keep the receipt email — it's your proof of license.</p>
</main></body></html>
