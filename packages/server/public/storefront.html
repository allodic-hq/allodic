<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="dark light"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>allodic registry</title><link rel="stylesheet" href="/assets/theme.css">
<style>
body{background:var(--bg);color:var(--ink);font-family:var(--sans);max-width:700px;margin:0 auto;padding:30px 24px;line-height:1.5}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);border-bottom:1.5px solid var(--edge);padding-bottom:14px}
.card{display:block;padding:18px;margin-top:14px;border:1.5px solid var(--edge);background:var(--panel);text-decoration:none;color:inherit;transition:transform .12s ease}
.card:hover{transform:translateY(-2px)}
.card .row{display:flex;justify-content:space-between;font-weight:650}
.card .row span{font-family:var(--mono);color:var(--stamp)}
.card p{color:var(--soft);font-size:14.5px;margin:5px 0 0}
.card .meta{font-family:var(--mono);font-size:12px;color:var(--soft);margin-top:6px}
.empty{color:var(--soft);margin-top:20px}
</style></head><body>
<div class="eyebrow">allodic registry</div>
<div style="font-family:var(--mono);font-size:13px;color:var(--stamp);padding:14px 0 2px;font-weight:600">{{stats}}</div>
<div style="font-family:var(--mono);font-size:12px;color:var(--soft);padding:2px 0 2px">every release passes three gates — it runs (open standard) · it works (reproducible benchmarks) · it's safe (scanned)</div>
{{cards}}
</body></html>
